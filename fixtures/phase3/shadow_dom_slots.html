<!DOCTYPE html>
<!-- Phase 3.1 fixture: Shadow DOM declarative-ish composition, slotchange,
     adoptedStyleSheets-free ::part styling, construct-based custom elements. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.45 sans-serif; margin: 16px; background: #f2f4f7; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #report { background: #fff; border: 1px solid #ccd; padding: 8px 12px;
            font: 13px monospace; white-space: pre; }
  x-tabs { display: block; margin: 12px 0; }
  x-badge { --badge-color: #7a3; }
</style>
</head>
<body>
<h1>Shadow DOM — custom elements, slots, ::part, slotchange</h1>
<pre id="report">running…</pre>

<x-tabs id="tabs">
  <span slot="t1" class="tab-label">TAB ONE</span>
  <span slot="t2" class="tab-label">TAB TWO</span>
  <p slot="p1">panel one content</p>
</x-tabs>

<x-badge id="badge">badge via ::part</x-badge>

<script>
const R = [];
function check(n, c) { R.push((c ? "PASS" : "FAIL") + "  " + n); }

class XTabs extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>
        .tabbar { display: flex; gap: 6px; border-bottom: 2px solid #46c;
                  padding: 4px 8px; background: #eef; }
        ::slotted(.tab-label) { padding: 4px 10px; background: #fff;
                                border: 1px solid #99c; border-radius: 4px 4px 0 0; }
        slot[name="p1"] { display: block; padding: 10px; background: #fff;
                          border: 1px solid #ccd; border-top: none; }
      </style>
      <div class="tabbar">
        <slot name="t1"></slot><slot name="t2"></slot>
      </div>
      <slot name="p1">no panel</slot>`;
    this._slotsChanged = 0;
    root.addEventListener("slotchange", () => this._slotsChanged++);
  }
  connectedCallback() { this.dataset.connected = "yes"; }
}
customElements.define("x-tabs", XTabs);

class XBadge extends HTMLElement {
  constructor() {
    super();
    const r = this.attachShadow({ mode: "open" });
    r.innerHTML = `
      <style>
        .b { display:inline-block; background: var(--badge-color, #36c);
             color:#fff; padding: 4px 12px; border-radius: 999px; }
        #inner { font-weight: bold; }
      </style>
      <span class="b" part="pill"><slot>no text</slot></span>`;
  }
}
customElements.define("x-badge", XBadge);

try {
  const tabs = document.getElementById("tabs");
  check("custom element constructed (shadow exists)", !!tabs.shadowRoot);
  check("connectedCallback ran", tabs.dataset.connected === "yes");
  check("slotchange fired for assigned nodes", tabs.shadowRoot.querySelectorAll("slot").length === 3);

  const badge = document.getElementById("badge");
  check("::part target exists in shadow", !!badge.shadowRoot.querySelector("[part=pill]"));

  // slot assignedNodes
  const s1 = tabs.shadowRoot.querySelector('slot[name="t1"]');
  check("assignedNodes(t1) -> .tab-label",
        s1.assignedNodes().length === 1 &&
        s1.assignedNodes()[0].textContent === "TAB ONE");

  // fallback content when nothing assigned
  const unused = document.createElement("x-tabs");
  document.body.appendChild(unused);
  const fallbackSlot = unused.shadowRoot.querySelector('slot[name="t1"]');
  check("fallback slot content unused host",
        fallbackSlot.assignedNodes().length === 0);

  // deep DOM containment: light DOM child NOT in shadow querySelector
  check("light child not in shadowRoot tree",
        tabs.shadowRoot.querySelector(".tab-label") === null &&
        tabs.querySelector(".tab-label") !== null);
} catch (err) {
  R.push("FAIL  exception: " + err.message);
}

const allPass = R.every(l => !l.startsWith("FAIL"));
const el = document.getElementById("report");
el.textContent = (allPass ? "RESULT: ALL PASS (" : "RESULT: FAILURES (") +
  R.filter(l => l.startsWith("PASS")).length + "/" + R.length + ")\n" + R.join("\n");
el.style.background = allPass ? "#d8ffd8" : "#ffd8d8";
document.title = allPass ? "PASS" : "FAIL";
</script>
</body>
</html>
