<!DOCTYPE html>
<!-- Phase 3.5 fixture: Canvas 2D — paths, arcs, fills/strokes, gradients,
     transforms, text, image smoothing, globalCompositeOperation, shadows,
     getImageData/putImageData round-trip, toDataURL sanity. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 sans-serif; margin: 14px; background: #f4f6f9; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #report { background: #fff; border: 1px solid #ccd; padding: 6px 10px;
            font: 12px monospace; white-space: pre; }
  canvas { background: #fff; border: 1px solid #ccd; border-radius: 6px; }
</style>
</head>
<body>
<h1>Canvas 2D API</h1>
<pre id="report">running…</pre>
<canvas id="c" width="600" height="300"></canvas>

<script>
const R = [];
function check(n, c) { R.push((c ? "PASS" : "FAIL") + "  " + n); }
try {
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  check("getContext('2d')", !!ctx);

  // paths + fill/stroke
  ctx.fillStyle = "#eef6ff"; ctx.fillRect(0, 0, 600, 300);
  ctx.beginPath();
  ctx.moveTo(40, 60); ctx.lineTo(120, 140); ctx.lineTo(40, 140); ctx.closePath();
  ctx.fillStyle = "#c0392b"; ctx.fill();
  ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 3; ctx.stroke();
  check("path fill+stroke", true);

  // arc
  ctx.beginPath(); ctx.arc(180, 90, 40, 0, Math.PI * 2);
  ctx.fillStyle = "#2980b9"; ctx.fill();
  check("arc", true);

  // gradient
  const grad = ctx.createLinearGradient(240, 40, 360, 140);
  grad.addColorStop(0, "#27ae60"); grad.addColorStop(1, "#f1c40f");
  ctx.fillStyle = grad; ctx.fillRect(240, 40, 120, 100);
  check("linear gradient", true);

  const rg = ctx.createRadialGradient(470, 90, 5, 470, 90, 50);
  rg.addColorStop(0, "#fff"); rg.addColorStop(1, "#8e44ad");
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(470, 90, 50, 0, 7); ctx.fill();
  check("radial gradient", true);

  // transforms
  ctx.save();
  ctx.translate(90, 220); ctx.rotate(Math.PI / 6); ctx.scale(1.2, 1);
  ctx.fillStyle = "#f39c12"; ctx.fillRect(-30, -15, 60, 30);
  ctx.restore();
  check("save/translate/rotate/scale/restore", true);

  // text
  ctx.font = "bold 18px sans-serif";
  ctx.fillStyle = "#111";
  ctx.fillText("Canvas text", 160, 232);
  const tw = ctx.measureText("Canvas text").width;
  check("measureText", tw > 50);

  // shadows
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
  ctx.fillStyle = "#16a085"; ctx.fillRect(300, 200, 80, 50);
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
  check("shadow state", true);

  // composite op
  const before = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "#e74c3c"; ctx.globalAlpha = .7; ctx.fillRect(420, 210, 70, 40);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = before;
  check("globalCompositeOperation/alpha", true);

  // bezier + quadratic
  ctx.beginPath();
  ctx.moveTo(30, 285); ctx.bezierCurveTo(80, 240, 130, 290, 180, 255);
  ctx.quadraticCurveTo(220, 230, 260, 270);
  ctx.strokeStyle = "#2980b9"; ctx.lineWidth = 2; ctx.stroke();
  check("bezier/quadratic curves", true);

  // pixel readback round-trip
  const px = ctx.getImageData(180, 90, 1, 1).data;   // blue circle center
  check("getImageData reads painted pixel", px[2] > 120 && px[3] === 255);
  ctx.putImageData(new ImageData(new Uint8ClampedArray([255, 0, 0, 255]), 1, 1), 590, 299);
  const px2 = ctx.getImageData(590, 299, 1, 1).data;
  check("putImageData round-trip", px2[0] === 255);

  // toDataURL
  const url = cv.toDataURL();
  check("toDataURL png", url.startsWith("data:image/png") && url.length > 1000);
} catch (err) { R.push("FAIL  exception: " + err.message); }

const allPass = R.every(l => !l.startsWith("FAIL"));
const el = document.getElementById("report");
el.textContent = (allPass ? "RESULT: ALL PASS (" : "RESULT: FAILURES (") +
  R.filter(l => l.startsWith("PASS")).length + "/" + R.length + ")\n" + R.join("\n");
el.style.background = allPass ? "#d8ffd8" : "#ffd8d8";
document.title = allPass ? "PASS" : "FAIL";
</script>
</body>
</html>
