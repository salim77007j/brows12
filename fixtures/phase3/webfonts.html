  @font-face {
    font-family: "DejaVu Network";
    src: url("/fonts/DejaVuSans.ttf") format("truetype");
  }
  body { font: 14px/1.4 sans-serif; margin: 14px; background: #f4f6f9; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #report { background: #fff; border: 1px solid #ccd; padding: 6px 10px;
            font: 12px monospace; white-space: pre; }
  .specimen { background: #fff; border: 1px solid #ccd; border-radius: 6px;
              padding: 10px 14px; margin: 10px 0; }
  .f1 { font-family: "OpenSans WOFF2"; font-weight: 600; font-size: 22px; }
  .f2 { font-family: "DejaVu Network"; font-size: 20px; }
  .f3 { font-family: "NoSuchFamilyXYZ", serif; font-size: 20px; }
  .f4 { font-family: "OpenSans WOFF2"; font-size: 18px; color: #2980b9; }

<body>
<h1>@font-face web fonts — WOFF2 + TTF</h1>
<pre id="report">running…</pre>

<div class="specimen">
  <div class="f1">WOFF2 web font: The quick brown fox 0123456789</div>
  <div class="f2">TTF over HTTP: The quick brown fox 0123456789</div>
  <div class="f3">Missing family must fall back to serif</div>
  <div class="f4">WOFF2 used at another size/weight context</div>
</div>

<script>
const R = [];
function check(n, c) { R.push((c ? "PASS" : "FAIL") + "  " + n); }
function widthOf(sel) {
  const el = document.querySelector(sel);
  return el.getBoundingClientRect().width;
}
try {
  // WOFF2 metrics differ from generic sans -> measurable width delta
  const probe = document.createElement("span");
  probe.textContent = "The quick brown fox 0123456789";
  probe.style.cssText = "position:absolute;visibility:hidden;font-size:22px;white-space:nowrap;";
  document.body.appendChild(probe);
  probe.style.fontFamily = "'OpenSans WOFF2'";
  const wWeb = probe.getBoundingClientRect().width;
  probe.style.fontFamily = "sans-serif";
  const wSans = probe.getBoundingClientRect().width;
  check("WOFF2 loaded (metrics != generic sans)",
        Math.abs(wWeb - wSans) > 0.5);
  R.push("NOTE  wWeb=" + wWeb.toFixed(1) + " wSans=" + wSans.toFixed(1));

  const w2 = widthOf(".f2"), w3 = widthOf(".f3");
  check("TTF network font rendered", w2 > 100);
  check("fallback to serif worked", w3 > 100);

  let fontsApi = "no document.fonts";
  try {
    fontsApi = "fonts.size=" + document.fonts.size;
  } catch (e) {}
  R.push("NOTE  FontFaceSet: " + fontsApi);

  const allPass = R.every(l => !l.startsWith("FAIL"));
  const el = document.getElementById("report");
  el.textContent = (allPass ? "RESULT: ALL PASS (" : "RESULT: FAILURES (") +
    R.filter(l => l.startsWith("PASS")).length + "/" + R.length + ")\n" + R.join("\n");
  el.style.background = allPass ? "#d8ffd8" : "#ffd8d8";
  document.title = allPass ? "PASS" : "FAIL";
} catch (err) {
  R.push("FAIL  exception: " + err.message);
  document.getElementById("report").textContent = R.join("\n");
}
</script>
</body>
