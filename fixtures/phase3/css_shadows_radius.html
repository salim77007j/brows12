<!DOCTYPE html>
<!-- Phase 3.3 fixture: box-shadow (all variants), text-shadow, border-radius
     (full + per-corner + elliptical). -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 sans-serif; margin: 14px; background: #fafbfd; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #report { background: #fff; border: 1px solid #ccd; padding: 6px 10px;
            font: 12px monospace; white-space: pre; }
  .row { display: flex; gap: 16px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
  .chip { width: 92px; height: 62px; background: #fff; border: 1px solid #dde;
          display: flex; align-items: center; justify-content: center;
          font-size: 11px; color: #555; }
  .s1 { box-shadow: 3px 3px 0 #c0392b; }
  .s2 { box-shadow: 2px 2px 8px rgba(0,0,0,.45); }
  .s3 { box-shadow: 0 0 0 4px #2980b9; }
  .s4 { box-shadow: 6px 0 12px -4px #8e44ad, -6px 0 12px -4px #27ae60; }
  .s5 { box-shadow: inset 0 6px 10px rgba(41,128,185,.7); }
  .r1 { border-radius: 16px; }
  .r2 { border-radius: 50%; }
  .r3 { border-radius: 24px 6px 24px 6px; }
  .r4 { border-radius: 30px / 14px; }
  .tt { font-size: 20px; font-weight: bold; color: #2c3e50;
        text-shadow: 2px 2px 0 #f39c12; }
  .tt2 { font-size: 20px; font-weight: bold; color: #fff;
         text-shadow: 0 0 6px #e74c3c, 0 0 14px #e74c3c; }
</style>
</head>
<body>
<h1>box-shadow / text-shadow / border-radius</h1>
<pre id="report">running…</pre>

<div class="row">
  <div class="chip s1">offset 0 blur</div>
  <div class="chip s2">blur rgba</div>
  <div class="chip s3">0-blur ring</div>
  <div class="chip s4">2 shadows spread</div>
  <div class="chip s5">inset</div>
</div>
<div class="row">
  <div class="chip r1">radius 16</div>
  <div class="chip r2">50% circle</div>
  <div class="chip r3">asymmetric</div>
  <div class="chip r4">elliptical</div>
</div>
<div class="row">
  <span class="tt">text-shadow offset</span>
  <span class="tt2">glow text-shadow</span>
</div>

<script>
const R = [];
function check(n, c) { R.push((c ? "PASS" : "FAIL") + "  " + n); }
try {
  const gs = (sel, prop) => getComputedStyle(document.querySelector(sel))[prop];
  check("box-shadow offset+no-blur", gs(".s1", "boxShadow").includes("3px"));
  check("box-shadow rgba blur", gs(".s2", "boxShadow").includes("rgba") ||
                                 gs(".s2", "boxShadow").includes("rgb"));
  check("box-shadow 0 0 0 4px ring", /0(?:px)?\s+0(?:px)?\s+0(?:px)?\s+4px/.test(gs(".s3", "boxShadow")));
  check("two box-shadows", gs(".s4", "boxShadow").split("),").length >= 2 ||
                            /,/.test(gs(".s4", "boxShadow")));
  check("inset box-shadow", gs(".s5", "boxShadow").includes("inset"));
  check("border-radius 16px", gs(".r1", "borderRadius") === "16px" ||
        gs(".r1", "borderTopLeftRadius") === "16px");
  check("border-radius 50%", /50%|9999/.test(gs(".r2", "borderRadius")));
  check("asymmetric radii", gs(".r3", "borderTopLeftRadius") === "24px" &&
        gs(".r3", "borderTopRightRadius") === "6px");
  check("elliptical radii (/)", gs(".r4", "borderRadius").includes("/"));
  check("text-shadow set", gs(".tt", "textShadow") !== "none");
  check("text-shadow multi", /,/.test(gs(".tt2", "textShadow")));
} catch (err) { R.push("FAIL  exception: " + err.message); }

const allPass = R.every(l => !l.startsWith("FAIL"));
const el = document.getElementById("report");
el.textContent = (allPass ? "RESULT: ALL PASS (" : "RESULT: FAILURES (") +
  R.filter(l => l.startsWith("PASS")).length + "/" + R.length + ")\n" + R.join("\n");
el.style.background = allPass ? "#d8ffd8" : "#ffd8d8";
document.title = allPass ? "PASS" : "FAIL";
</script>
</body>
</html>
