[package]
name = "brows12-render"
description = "Brows12 2D rendering: display lists, tiny-skia rasterization, cosmic-text glyph atlas, compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
brows12-html = { path = "../parsing/html" }
brows12-css = { path = "../parsing/css" }
brows12-layout = { path = "../layout" }
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tiny-skia = { version = "0.12", features = ["png-format"] }
thiserror = "2"
tracing = "0.1"
resvg = "0.45"

[dev-dependencies]
cosmic-text = "0.19"
