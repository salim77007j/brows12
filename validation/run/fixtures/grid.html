<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Grid Test</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  h1 { margin: 8px; font-size: 22px; }
  .gallery {
    display: grid;
    grid-template-columns: 200px 1fr 1fr;
    grid-template-rows: 90px 60px;
    gap: 10px;
    padding: 10px;
    background: #f0f0f0;
  }
  .cell { background: #4a90d9; color: white; padding: 6px; font-size: 14px; }
  .wide { grid-column: 1 / span 2; background: #2e7d32; }
  .tall { grid-row: 1 / span 2; background: #b8860b; }
  .auto { grid-column: auto / auto; background: #8e44ad; }
  .placement {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px;
  }
  .placement .c { background: #555; color: #fff; padding: 4px; text-align: center; }
</style>
</head>
<body>
  <h1>CSS Grid</h1>
  <div class="gallery">
    <div class="cell tall">tall (row 1-3)</div>
    <div class="cell wide">wide (col 1-3)</div>
    <div class="cell">c3</div>
    <div class="cell">c4</div>
    <div class="cell">c5</div>
  </div>
  <div class="placement">
    <div class="c">a</div><div class="c">b</div><div class="c">c</div>
    <div class="c">d</div><div class="c">e</div><div class="c">f</div>
  </div>
</body>
</html>
