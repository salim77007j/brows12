<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Colspan Rowspan Test</title>
<style>
  body { margin: 20px; font-family: sans-serif; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #555; padding: 6px 14px; font-size: 14px; }
  th { background: #ddd; }
</style>
</head>
<body>
  <table>
    <tr><th>ID</th><th>Name</th><th>Dept</th></tr>
    <tr><td>1</td><td>Ada Lovelace</td><td>Mathematics</td></tr>
    <tr><td>2</td><td colspan="2">Grace Hopper — full row width via colspan=2</td></tr>
    <tr><td>3</td><td>Alan Turing</td><td rowspan="2">Also covers the next row via rowspan=2</td></tr>
    <tr><td>4</td><td>Katherine Johnson</td></tr>
  </table>
</body>
</html>
