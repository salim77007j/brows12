[package]
name = "brows12-css"
description = "Brows12 CSS parsing (lightningcss), selector matching and cascade computation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
brows12-html = { path = "../html" }
lightningcss = { version = "1.0.0-alpha.72", features = ["into_owned"] }
parcel_selectors = "0.28"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
