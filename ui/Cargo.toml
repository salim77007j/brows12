[package]
name = "brows12-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Brows12 minimal native browser shell: window, omnibox, tabs, wired to brows12-api"
publish = false

[dependencies]
brows12-api = { path = "../api" }
brows12-render = { path = "../rendering" }
brows12-layout = { path = "../layout" }
cosmic-text = "0.19"
tiny-skia = "0.12"
winit = "0.30"
softbuffer = "0.4"

[[bin]]
name = "brows12-ui"
path = "src/main.rs"
