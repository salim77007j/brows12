[package]
name = "servo-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Servo-backed host for brows12: embeds the Servo engine behind the brows12 shell and harness."

[dependencies]
servo = { version = "=0.6.0", default-features = false, features = [
    "baked-in-resources",
    "js_jit",
    "brotli-compression-stream",
    "webcrypto",
] }
url = "2.5"
winit = "0.30"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brows12-privacy = { path = "../privacy" }
brows12-storage = { path = "../storage" }
servo-net-traits = "=0.6.0"
# Patched-in via [patch.crates-io]; direct dep so the DecodeCap integration
# tests (tests/decode_cap.rs) exercise the fork's public surface.
servo-net = "=0.6.0"
servo-embedder-traits = "=0.6.0"
servo-base = "=0.6.0"
ipc-channel = "0.22"
content-security-policy = "0.8"

# v2.1 Phase 4 GPU support (docs/GPU_SUPPORT.md):
# - Windows uses surfman's ANGLE/D3D11 backend (servo's `no-wgl`) instead of
#   the WGL backend whose WGL_NV_DX_interop dependency panicked on integrated
#   GPUs. Declared on both `servo` dependents (servo-host, ui) so feature
#   unification is unambiguous.
[target.'cfg(windows)'.dependencies]
servo = { version = "=0.6.0", default-features = false, features = [
    "baked-in-resources",
    "js_jit",
    "brotli-compression-stream",
    "webcrypto",
    "no-wgl",
] }
# gfx::libegl_available pre-check (same winapi tree surfman already uses).
winapi = { version = "0.3", features = ["libloaderapi", "winnt"] }
# Force-build the ANGLE runtime DLLs (libEGL.dll/libGLESv2.dll). servo's
# `no-wgl` also enables mozangle/build_dlls transitively, but a DIRECT
# dependency guarantees the feature applies (cargo always honors direct
# dependency features) — without the DLLs, surfman's LoadLibraryA("libEGL.dll")
# cannot find ANGLE at runtime on Windows (docs/GPU_SUPPORT.md §5). The
# release workflow stages the built DLLs next to the executables.
mozangle = { version = "0.7", features = ["egl", "build_dlls"] }
