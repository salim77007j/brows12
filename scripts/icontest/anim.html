<!DOCTYPE html><html><head><title>Anim</title><style>
body{margin:0;background:#f0f0f0}
.box{position:absolute;width:120px;height:120px;background:#2b6cb0;border-radius:12px}
#b2{background:#c0392b}
</style></head><body>
<div class="box" id="b1"></div><div class="box" id="b2"></div>
<script>
let t=0;
function frame(){
  t+=0.03;
  const b1=document.getElementById('b1'), b2=document.getElementById('b2');
  b1.style.transform='translate('+(300+200*Math.sin(t))+'px,'+(200+150*Math.cos(t))+')';
  b2.style.transform='translate('+(500+200*Math.cos(t*1.3))+'px,'+(300+120*Math.sin(t*0.7))+')';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
