[package]
name = "brows12-api"
description = "Brows12 public API for UI layers: documented Rust facade plus an optional C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
capi = []

[dependencies]
brows12-engine = { path = "../engine" }
brows12-layout = { path = "../layout" }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
