[workspace]
exclude = [
    "validation/x11driver",
    # --- v2.0 legacy engine (retired with the Servo pivot; recoverable from
    # git history; tag v1.0.0-rc1 preserves the custom-engine snapshot) ---
    "parsing/html",
    "parsing/css",
    "layout",
    "rendering",
    "compositor",
    "networking",
    "js",
    "engine",
    "api",
    "tests",
    "benchmarks",
    "fuzz",
    "harness",
]
resolver = "2"
members = [
    "storage",
    "privacy",
    "servo-host",
    "ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salim77007j/brows12"
homepage = "https://github.com/salim77007j/brows12"
documentation = "https://github.com/salim77007j/brows12/tree/main/docs"
authors = ["salim77007j"]
keywords = ["browser", "engine", "quickjs", "privacy", "rendering"]
categories = ["web-programming", "rendering"]

[profile.dev]
# 9.9GB CI box with wgpu test links: strip debug info to keep artifacts lean
debug = 0
strip = "debuginfo" 

# Realistic runtime performance for the headless harness without paying full opt cost
[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
debug = true

# --- Phase 4 Area 1: local Servo engine patches -------------------------------
# The brows12 project carries minimal, upstreamable patches to the Servo
# engine crates (all published to crates.io). Each patch fixes a Phase 3
# gap; see docs/PHASE4_AREA1_REPORT.md and the git history of patched/.
[patch.crates-io]
stylo = { path = "patched/stylo" }
stylo_static_prefs = { path = "patched/stylo-static-prefs" }
servo-config = { path = "patched/servo-config" }
servo-layout = { path = "patched/servo-layout" }
servo-canvas = { path = "patched/servo-canvas" }
servo-script-bindings = { path = "patched/servo-script-bindings" }
