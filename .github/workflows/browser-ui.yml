name: browser-ui

# Build the full browser (engine + native shell) on Windows and Linux and
# publish the binaries as downloadable artifacts. The Linux job additionally
# launches the real window under Xvfb and drives a navigation through the
# automation FIFOs, proving the artifact actually runs.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: brows12-ui-linux-x86_64
            bin: brows12-ui
          - os: windows-latest
            artifact: brows12-ui-windows-x86_64
            bin: brows12-ui.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux runtime deps (freetype/fontconfig + X11 client libs + Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libxcb1 libxcb-xkb1 libxcursor1 libxrandr2 libxi6 \
            libegl1 libgl1 libglx0 libgl1-mesa-dri \
            xvfb x11-utils

      - name: Build release (engine + UI)
        run: cargo build --release -p brows12-ui

      - name: Stage ANGLE runtime DLLs next to the exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # mozangle (features = egl + build_dlls) builds libEGL.dll /
          # libGLESv2.dll into its build-script OUT_DIR. surfman loads
          # libEGL.dll at runtime via LoadLibraryA — the DLLs must sit next
          # to the exe or the GPU lane cannot initialize and the shell
          # exits with "libEGL.dll could not be loaded" (docs/GPU_SUPPORT.md
          # §5). Locate them anywhere under target/ (upstream servo rglobs
          # the same tree) and copy next to brows12-ui.
          EGL=$(find target -name "libEGL.dll" -not -path "*/deps/*" 2>/dev/null | head -1)
          if [ -z "$EGL" ]; then
            echo "FATAL: libEGL.dll not found anywhere under target/ — ANGLE runtime was not built. Diagnostics:"
            find target -maxdepth 4 -type d -name "mozangle*" 2>/dev/null || true
            find target -maxdepth 3 -type d -name "build" 2>/dev/null | head || true
            exit 1
          fi
          DIR=$(dirname "$EGL")
          echo "mozangle out: $DIR"
          ls -la "$DIR"
          for f in libEGL.dll libGLESv2.dll; do
            cp "$DIR/$f" "target/release/$f"
          done

      - name: Smoke-run the real window under Xvfb (Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          set -e
          export DISPLAY=:97
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp &
          sleep 1
          RUNDIR=validation/run-ci
          mkdir -p "$RUNDIR"
          mkfifo "$RUNDIR/cmd.fifo" "$RUNDIR/events.fifo"
          # O_RDWR opens on a FIFO never block: if the UI dies before it
          # opens its end, the reads below see EOF fast instead of the
          # whole step hanging to its timeout with zero output.
          BROWS12_UI_CMD_FIFO="$RUNDIR/cmd.fifo" \
          BROWS12_UI_EVENT_FIFO="$RUNDIR/events.fifo" \
            ./target/release/brows12-ui > "$RUNDIR/ui.log" 2>&1 &
          UI_PID=$!
          exec 3<>"$RUNDIR/events.fifo"
          exec 4<>"$RUNDIR/cmd.fifo"
          # 1. wait for the start-page load event (the UI emits
          # `loaded tab=1 url=brows12://start title=` — the title is
          # still empty at Complete; there is no `tab_created` event).
          for i in $(seq 1 120); do
            IFS= read -r -t 1 line <&3 || true
            [[ "${line:-}" == loaded*url=brows12://start* ]] && break
          done
          [[ "${line:-}" == loaded*url=brows12://start* ]] || { cat "$RUNDIR/ui.log"; exit 1; }
          echo "smoke: start page loaded: $line"
          # 2. navigate to example.com and wait for the real load
          echo '<OMNI> example.com' >&4
          echo '<RETURN>' >&4
          OK=0
          for i in $(seq 1 120); do
            IFS= read -r -t 1 line <&3 || true
            [[ "${line:-}" == loaded*url=https://example.com* ]] && { OK=1; break; }
          done
          [[ $OK == 1 ]] || { cat "$RUNDIR/ui.log"; exit 1; }
          echo "smoke: example.com loaded: $line"
          # 3. clean quit
          echo '<QUIT>' >&4
          for i in $(seq 1 30); do
            IFS= read -r -t 1 line <&3 || true
            [[ "${line:-}" == quit ]] && break
          done
          wait $UI_PID
          echo "smoke: PASS"

      - name: Package artifact
        shell: bash
        run: |
          set -e
          mkdir -p upload
          cp "target/release/${{ matrix.bin }}" upload/
          cp README.md upload/
          cp docs/CAPABILITY_REPORT.md upload/ 2>/dev/null || true
          # Windows: ship the ANGLE runtime next to the exe — surfman
          # resolves libEGL.dll relative to the exe at load time. Shipping a
          # DLL-less zip is a P0 packaging regression (it makes the browser
          # unlaunchable), so hard-fail instead.
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in libEGL.dll libGLESv2.dll; do
              [ -f "target/release/$f" ] || { echo "FATAL: $f was not staged next to the exe — refusing to package a broken zip"; exit 1; }
              cp "target/release/$f" upload/
            done
          fi
      - name: Verify artifact contents (P0 gate)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          ls -la upload/
          for f in brows12-ui.exe libEGL.dll libGLESv2.dll README.md; do
            [ -s "upload/$f" ] || { echo "FATAL: upload/$f missing or empty"; exit 1; }
          done
          sz=$(stat -c%s upload/libGLESv2.dll)
          [ "$sz" -gt 1000000 ] || { echo "FATAL: libGLESv2.dll too small ($sz bytes) — not a real ANGLE build"; exit 1; }
          echo "artifact gate: PASS — brows12-ui.exe + ANGLE runtime (libEGL.dll, libGLESv2.dll) + README"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: upload/
          if-no-files-found: error
