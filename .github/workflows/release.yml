name: release

# v2.1 Phase 4 — permanent release binaries.
#
# Triggered by pushing a tag (v*). Builds the full browser (brows12-ui) plus
# the headless engine harness (brows-servo, brows-perf) with fat LTO and
# codegen-units=1 on all four release platforms, strips each binary, enforces
# the < 50 MB per-binary gate, attaches sha256 checksums, and publishes a
# GitHub Release with docs/RELEASE_NOTES.md as the body.
#
# GitHub Releases are PERMANENT (artifacts expire after 90 days — releases
# do not). Tags containing "rc" produce a pre-release (not marked latest).

on:
  push:
    tags: ["v*"]
  # Manual dispatch for a given tag ref (also the fallback if the
  # tag-push trigger is swallowed by the platform quirk that records
  # empty ref=null runs for tags-filtered workflows on every push).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Mission 4.1: fat LTO + codegen-units=1 for the release profile.
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
          # --- macOS legs DISABLED (user request, 2026-10): macOS runners
          # queue for too long and starve the Linux/Windows release lane.
          # The cross-compilation recipe is kept below (it was proven green
          # on v2.1.0-rc10: arm64 native + x86_64 via Apple -arch from the
          # arm64 runner); re-enable by uncommenting both entries.
          # - os: macos-14
          #   target: aarch64-apple-darwin
          #   name: macos-arm64
          #   ext: ""
          # - os: macos-14
          #   target: x86_64-apple-darwin
          #   name: macos-x86_64
          #   ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libxcb1 libxcb-xkb1 libxcursor1 libxrandr2 libxi6 \
            libegl1 libgl1 xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (fat LTO, codegen-units=1)
        # macOS legs (disabled 2026-10, kept for re-enabling): build
        # scripts run on the arm64 host, final codegen targets the matrix
        # triple. Linux keeps the full set (the smoke step runs
        # brows-servo); windows keeps all three (it fits easily).
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }} -p brows12-ui
          else
            cargo build --release --target ${{ matrix.target }} -p brows12-ui -p servo-host
          fi

      - name: Strip binaries (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          for b in brows12-ui brows-servo brows-perf; do
            f="target/${{ matrix.target }}/release/$b${{ matrix.ext }}"
            [ -f "$f" ] || continue
            strip -s "$f" || strip "$f"
          done

      - name: Install UPX
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update >/dev/null 2>&1 || true
            sudo apt-get install -y upx-ucl >/dev/null 2>&1 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install upx >/dev/null 2>&1 || true
          else
            # windows: choco ships upx; fall back silently if absent
            choco install upx -y --no-progress >/dev/null 2>&1 || true
          fi
          command -v upx && upx --version | head -1 || echo "upx: NOT AVAILABLE"

      - name: UPX compress (best/lzma; best-effort per platform)
        shell: bash
        run: |
          set -e
          if ! command -v upx >/dev/null 2>&1; then echo "upx missing, skip"; exit 0; fi
          for b in brows12-ui brows-servo brows-perf; do
            f="target/${{ matrix.target }}/release/$b${{ matrix.ext }}"
            [ -f "$f" ] || continue
            upx --best --lzma -q "$f" \
              || upx --best --lzma --force-macos -q "$f" \
              || echo "upx: could not compress $b — will be gated as-is"
          done
          # UPX invalidates the Mach-O ad-hoc signature; arm64 macOS
          # refuses to execute invalidly-signed binaries, so re-sign.
          if [ "${{ runner.os }}" = "macOS" ]; then
            for b in brows12-ui brows-servo brows-perf; do
              f="target/${{ matrix.target }}/release/$b${{ matrix.ext }}"
              [ -f "$f" ] || continue
              codesign --force --sign - "$f" || true
              codesign --verify "$f" && echo "codesign OK: $b" || echo "codesign verify FAILED: $b"
            done
          fi

      - name: Stage ANGLE runtime DLLs next to the exes (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # mozangle builds libEGL.dll/libGLESv2.dll into its OUT_DIR; the
          # exe implicitly imports libEGL.dll, so they must sit next to it
          # (docs/GPU_SUPPORT.md §5).
          OUT=$(ls -d target/*/build/mozangle-*/out | head -1)
          echo "mozangle out: $OUT"
          ls -la "$OUT"/*.dll
          for f in libEGL.dll libGLESv2.dll; do
            cp "$OUT/$f" "target/${{ matrix.target }}/release/$f"
          done

      - name: Smoke — windows headless engine loads example.com (ANGLE/WARP)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: bash
        run: |
          set -e
          ./target/${{ matrix.target }}/release/brows-servo.exe \
            --url https://example.com/ --width 1280 --height 800 \
            --settle-ms 1500 --timeout-ms 30000 \
            --png /tmp/rel_smoke.png --json /tmp/rel_smoke.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/rel_smoke.json'))
          ok = d.get('complete') or (d.get('tabs') or [{}])[0].get('complete')
          assert ok, 'example.com did not complete'
          print('windows release smoke: PASS (ANGLE stack loads, page completes)')
          PY

      - name: Size gate (< 50 MB per binary)
        shell: bash
        run: |
          set -e
          FAIL=0
          for b in brows12-ui brows-servo brows-perf; do
            f="target/${{ matrix.target }}/release/$b${{ matrix.ext }}"
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$b: $((sz / 1024 / 1024)) MB ($sz bytes)"
            [ "$sz" -lt 52428800 ] || { echo "SIZE GATE FAILED: $b >= 50 MB"; FAIL=1; }
          done
          exit $FAIL

      - name: Smoke — linux headless engine loads example.com
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          set -e
          export DISPLAY=:97
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp &
          sleep 1
          export XDG_RUNTIME_DIR=/tmp/xdg && mkdir -p /tmp/xdg
          ./target/${{ matrix.target }}/release/brows-servo \
            --url https://example.com/ --width 1280 --height 800 \
            --settle-ms 1500 --timeout-ms 30000 \
            --png /tmp/rel_smoke.png --json /tmp/rel_smoke.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/rel_smoke.json'))
          # brows-servo emits a flat report; brows-perf wraps pages in tabs[].
          ok = d.get('complete') or (d.get('tabs') or [{}])[0].get('complete')
          assert ok, 'example.com did not complete'
          print('release smoke: PASS')
          PY

      - name: Package
        shell: bash
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          DIR="brows12-${VER}-${{ matrix.name }}"
          mkdir -p "$DIR"
          # Ship the browser binary (the product). brows-servo/brows-perf
          # stay buildable from source; three ~40MB binaries per zip would
          # triple the download for no user value.
          cp "target/${{ matrix.target }}/release/brows12-ui${{ matrix.ext }}" "$DIR/"
          # Windows: the ANGLE runtime DLLs are load-time dependencies of
          # the exe (docs/GPU_SUPPORT.md §5) — ship them next to it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in libEGL.dll libGLESv2.dll; do
              cp "target/${{ matrix.target }}/release/$f" "$DIR/"
            done
          fi
          cp README.md "$DIR/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$DIR\\*' -DestinationPath '$DIR.zip' -Force"
          else
            zip -q -r "$DIR.zip" "$DIR"
          fi
          shasum -a 256 "$DIR.zip" > "$DIR.zip.sha256" 2>/dev/null \
            || sha256sum "$DIR.zip" > "$DIR.zip.sha256"
          echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            *.zip
            *.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist/
      - name: Publish GitHub Release (permanent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh CLI instead of a third-party action (action resolution was
          # failing with "repository not found" on this repo).
          FLAGS=""
          case "$GITHUB_REF_NAME" in *rc*) FLAGS="--prerelease";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" --clobber dist/*.zip dist/*.sha256 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "brows12 ${GITHUB_REF_NAME}" \
                 --notes-file docs/RELEASE_NOTES.md \
                 $FLAGS dist/*.zip dist/*.sha256
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
