name: CI

# v2.1 Phase 4: v2 workspace (storage, privacy, servo-host, ui — Servo 0.6
# engine). Fixed the v1-era broken trigger (`branches: ain]`), dropped the
# retired v1 crates (brows12-benchmarks / brows12-harness / brows binary),
# and kept the sanitizer program (ASan + TSan nightly build-std; Valgrind
# added) scoped to the brows12 workspace crates.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS leg DISABLED (user request, 2026-10): macOS runners queue
        # for too long and starve the Linux/Windows lanes. Re-enable by
        # adding `macos-latest` back to this list. (Sanitizer + valgrind
        # jobs below are Linux-only and unaffected.)
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (freetype/fontconfig for servo stack, X11 client libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libxcb1 libxcb-xkb1 libxcursor1 libxrandr2 libxi6 \
            libegl1 libgl1 xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (workspace)
        run: cargo build --workspace

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Headless smoke (brows-servo renders example.com, Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          set -e
          export DISPLAY=:97
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp &
          sleep 1
          export XDG_RUNTIME_DIR=/tmp/xdg && mkdir -p /tmp/xdg
          ./target/debug/brows-servo --url https://example.com/ \
            --width 1280 --height 800 --settle-ms 1500 --timeout-ms 30000 \
            --png /tmp/smoke.png --json /tmp/smoke.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/smoke.json'))
          # brows-servo emits a flat report; brows-perf wraps pages in tabs[].
          ok = d.get('complete') or (d.get('tabs') or [{}])[0].get('complete')
          assert ok, 'example.com did not complete'
          print('smoke: PASS', d.get('title'))
          PY

  sanitizer-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxcb1
      - name: Install nightly Rust (asan requires build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: asan
      - name: Build and test under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          # run_libc_freeres releases glibc's own one-time allocations
          # (getaddrinfo resolver buffers from the network-path tests) that
          # LSan would otherwise report; the engine itself is leak-checked.
          ASAN_OPTIONS: detect_leaks=1:run_libc_freeres=1
        # Scoped to the brows12 workspace crates; the vendored engine
        # (servo/mozjs C++) is upstream-covered. Recorded honestly in
        # docs/V2_1_PHASE4_REPORT.md.
        run: cargo +nightly -Zbuild-std=std,panic_abort test --tests --target x86_64-unknown-linux-gnu -p brows12-privacy -p brows12-storage

  sanitizer-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxcb1
      - name: Install nightly Rust (tsan requires build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Build and test under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=0:report_bugs=1
        run: cargo +nightly -Zbuild-std=std,panic_abort test --tests --target x86_64-unknown-linux-gnu -p brows12-privacy -p brows12-storage

  sanitizer-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxcb1 valgrind
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: valgrind
      - name: Build test binaries (debug, no debuginfo to keep valgrind fast)
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --no-run -p brows12-privacy -p brows12-storage
      - name: Run unit tests under Valgrind memcheck (zero-defects gate)
        run: |
          set -e
          FAIL=0
          for bin in target/debug/deps/brows12_privacy-* target/debug/deps/brows12_storage-*; do
            [ -x "$bin" ] || continue
            case "$bin" in *\.d|*so) continue;; esac
            echo "== valgrind $bin"
            valgrind --error-exitcode=99 --errors-for-leak-kinds=none -q "$bin" || FAIL=1
          done
          exit $FAIL
