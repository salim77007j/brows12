[package]
name = "brows12-js"
description = "Brows12 JavaScript: QuickJS-ng runtime (rquickjs), event loop, DOM / fetch / storage / navigator bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
brows12-css = { path = "../parsing/css" }
brows12-html = { path = "../parsing/html" }
brows12-net = { path = "../networking" }
brows12-privacy = { path = "../privacy" }
brows12-storage = { path = "../storage" }
lightningcss = { version = "1.0.0-alpha.72", features = ["into_owned"] }
parcel_selectors = "0.28"
rquickjs = { version = "0.14", features = ["loader"] }
base64 = "0.22"
fastrand = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
url = "2.5"
brows12-render = { path = "../rendering" }
tiny-skia = { version = "0.12", features = ["png-format"] }
cosmic-text = "0.19"
wasmi = "2"
# WebGL2 over wgpu: GLSL ES 3.0 -> naga IR -> WGSL -> wgpu pipelines.
# glsl-in parses ESSL, wgsl-out avoids coupling to wgpu's internal naga types.
naga = { version = "30.0.1", default-features = false, features = ["glsl-in", "wgsl-out"] }
wgpu = { version = "30", default-features = true }
pollster = "0.4"
