[package]
name = "brows12-storage"
description = "Brows12 storage: cookie jar with CHIPS partitioning, redb KV, web storage, HTTP cache, IndexedDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
blake3 = "1"
httpdate = "1"
psl = "2"
redb = { version = "4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2.5"

[features]
default = ["persist"]
# Persistent on-disk KV via redb
persist = ["dep:redb"]

[dev-dependencies]
tempfile = "3"
